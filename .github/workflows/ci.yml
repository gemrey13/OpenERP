name: Test .NET 10 App

on:
  push:
    branches: ["main"]

  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: windows-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore API
        run: dotnet restore OpenERP.API/OpenERP.API.csproj

      - name: Restore Tests
        run: dotnet restore OpenERP.Tests/OpenERP.Tests.csproj

      - name: Build API
        run: dotnet build OpenERP.API/OpenERP.API.csproj --no-restore

      - name: Build Tests
        run: dotnet build OpenERP.Tests/OpenERP.Tests.csproj --no-restore

      - name: Run Tests
        run: dotnet test OpenERP.Tests/OpenERP.Tests.csproj --no-build --no-restore